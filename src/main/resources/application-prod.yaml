# Production (Render). Secrets come from environment variables only.
logging:
  structured:
    format:
      console: ecs
smartbite:
  v2:
    stores:
      # firestore (default) or postgres (our own database; needs DATABASE_URL), D-024.
      mode: ${SMARTBITE_STORES_MODE:firestore}
    auth:
      fake-tokens-enabled: false
