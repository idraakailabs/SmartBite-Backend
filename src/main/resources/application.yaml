server:
  port: ${PORT:8080}

spring:
  application:
    name: smartbite
  profiles:
    active: local
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      # Jackson 3 (Spring Boot 4) fails on missing primitives by default. v1 relies on bean validation
      # reporting them as 400 "Validation failed", so keep the Jackson 2 behaviour.
      fail-on-null-for-primitives: false

gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai

groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1

smartbite:
  v1:
    # D-021 item 4: hardening that leaves the v1 request/response contract unchanged.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    rate-limit-per-minute: ${V1_RATE_LIMIT_PER_MINUTE:60}
    rate-limit-per-hour: ${V1_RATE_LIMIT_PER_HOUR:600}
    trusted-proxies: ${TRUSTED_PROXIES:1}
    ai-connect-timeout: 3s
    ai-read-timeout: 30s
