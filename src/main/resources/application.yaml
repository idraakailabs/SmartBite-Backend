server:
  port: ${PORT:8080}
  # Finish in-flight requests on SIGTERM. Set Render's shutdown delay to 60 s (docs/ops/DEPLOYMENT.md).
  shutdown: graceful
  # Bodies are capped at 32 KiB by the v2 body-size filter; Tomcat's own cap on headers stays default.

spring:
  application:
    name: smartbite
  lifecycle:
    # Longer than the 40 s recipe deadline, shorter than the 60 s Render shutdown delay we recommend.
    timeout-per-shutdown-phase: 45s
  # No hard-coded active profile: set SPRING_PROFILES_ACTIVE (staging | prod) on each environment.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      # Jackson 3 (Spring Boot 4) fails on missing primitives by default. v1 relies on bean validation
      # reporting them as 400 "Validation failed", so keep the Jackson 2 behaviour.
      fail-on-null-for-primitives: false

gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai

groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1

smartbite:
  v1:
    # D-021 item 4: hardening that leaves the v1 request/response contract unchanged.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    rate-limit-per-minute: ${V1_RATE_LIMIT_PER_MINUTE:60}
    rate-limit-per-hour: ${V1_RATE_LIMIT_PER_HOUR:600}
    trusted-proxies: ${TRUSTED_PROXIES:1}
    ai-connect-timeout: 3s
    ai-read-timeout: 30s

  # v2 settings (docs/api/README.md, docs/ops/ENVIRONMENT.md). Secrets only through environment variables.
  v2:
    auth:
      fake-tokens-enabled: false
      reauth-max-age: 5m
      pre-auth-per-ip-per-minute: 120
    stores:
      mode: ${SMARTBITE_STORES_MODE:firestore}
      allow-in-memory: false
      collection-prefix: ${FIRESTORE_COLLECTION_PREFIX:}
      firebase-project-id: ${FIREBASE_PROJECT_ID:}
      service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
      operation-timeout: 3s
    limits:
      max-body-bytes: 32768
      # PUT /api/v2/me/history carries up to 100 entries (D-024).
      max-history-body-bytes: 262144
      suggestions-per-minute: 6
      suggestions-per-hour: 40
      recipes-per-minute: 6
      recipes-per-hour: 30
      reports-per-hour: 10
      reports-per-day: 30
      quota-per-minute: 30
      delete-per-hour: 3
      history-per-minute: 30
      profile-per-minute: 30
    logging:
      uid-hash-key: ${LOG_UID_HASH_KEY:}
    quota:
      free-daily-suggestions: ${FREE_DAILY_SUGGESTIONS:3}
      reservation-ttl: 2m
      timezone-repin-after: 24h
      remote-config-sync-enabled: ${REMOTE_CONFIG_SYNC_ENABLED:true}
      remote-config-refresh: 5m
      idempotent-replay-ttl: 10m
    entitlement:
      provider: ${ENTITLEMENT_PROVIDER:revenuecat}
      base-url: https://api.revenuecat.com/v2
      secret-api-key: ${REVENUECAT_SECRET_API_KEY:}
      project-id: ${REVENUECAT_PROJECT_ID:}
      lookup-key: ${REVENUECAT_ENTITLEMENT_LOOKUP_KEY:smartbite_pro}
      ttl-premium: ${ENTITLEMENT_CACHE_TTL_PREMIUM:5m}
      ttl-free: ${ENTITLEMENT_CACHE_TTL_FREE:1m}
      stale-if-error: 24h
      refresh-min-interval: 30s
      connect-timeout: 2s
      read-timeout: 3s
    ai:
      suggestion-deadline: ${SUGGESTION_DEADLINE:25s}
      recipe-deadline: ${RECIPE_DEADLINE:40s}
      connect-timeout: 3s
      read-timeout: 15s
      recipe-read-timeout: 30s
      min-remaining-for-attempt: 5s
      groq-base-url: ${groq.base-url}
      groq-api-key: ${groq.api-key}
      gemini-base-url: ${gemini.base-url}
      gemini-api-key: ${gemini.api-key}
      prompt-version: suggest-v2.2
      recipe-prompt-version: recipe-v2.2
    places:
      provider: ${PLACES_PROVIDER:disabled}
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: https://places.googleapis.com/v1
      nearby-global-daily-cap: ${PLACES_NEARBY_GLOBAL_DAILY_CAP:150}
      text-global-daily-cap: ${PLACES_TEXT_GLOBAL_DAILY_CAP:3000}
      nearby-per-uid-daily: ${PLACES_NEARBY_PER_UID_DAILY:15}
      text-per-uid-daily: ${PLACES_TEXT_PER_UID_DAILY:60}
      cache-ttl: ${PLACES_CACHE_TTL:7d}
      verify-alternatives: ${PLACES_VERIFY_ALTERNATIVES:false}
      connect-timeout: 2s
      read-timeout: 4s
      stage-budget: 5s
      included-types: [restaurant]
    recipes:
      steps-premium: ${RECIPE_STEPS_PREMIUM:true}
      free-preview-steps: ${RECIPE_FREE_PREVIEW_STEPS:2}
      cache-ttl: 30d
    deletion:
      retry-interval: 15m
      retry-window: 24h
      # Deletes the RevenueCat customer on DELETE /api/v2/me. Off on staging (shared RevenueCat project).
      billing-deletion-enabled: ${BILLING_DELETION_ENABLED:true}
    # Our own PostgreSQL (D-024). DATABASE_URL accepts Render's connection string as-is. Unset = no database:
    # history and profile endpoints answer 503 FEATURE_UNAVAILABLE, and stores.mode must not be postgres.
    database:
      url: ${DATABASE_URL:}
      username: ${DATABASE_USERNAME:}
      password: ${DATABASE_PASSWORD:}
      max-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      connect-timeout: 5s
      statement-timeout: 5s
    # Cloud meal history (D-024): 24-month retention; inactive accounts' history removed after 24 months.
    history:
      retention-months: 24
      inactive-months: 24
      max-batch: 100
      page-size: 500
      cleanup-interval: 24h
      max-profile-bytes: 16384

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    # Liveness must not depend on Firestore or providers; readiness stays simple too.
    defaults:
      enabled: false
    ping:
      enabled: true
