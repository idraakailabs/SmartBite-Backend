    Problem:
      type: object
      description: RFC 9457 Problem Details with SmartBite extensions. Served as `application/problem+json`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          examples: ['urn:smartbite:problem:daily-limit-reached']
        title:
          type: string
          description: Short, user-safe summary. Not for branching.
        status:
          type: integer
        detail:
          type: string
          description: User-safe explanation. Never contains exception messages, provider responses or personal data.
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
        errors:
          description: Present for `VALIDATION_FAILED`.
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
                examples: [area.radius_km]
              code:
                type: string
                examples: [required, invalid_size, out_of_range, invalid_value, invalid_timezone]
              message:
                type: string
        limit:
          type: integer
          description: Present for `DAILY_LIMIT_REACHED`.
        used:
          type: integer
          description: Present for `DAILY_LIMIT_REACHED`.
        reset_at:
          $ref: '#/components/schemas/Instant'
          description: Present for `DAILY_LIMIT_REACHED`; next local midnight in the pinned timezone.
        retry_after_seconds:
          type: integer
          description: Same value as the `Retry-After` header, for `RATE_LIMITED`, `DAILY_LIMIT_REACHED` and `PROVIDER_UNAVAILABLE`.

