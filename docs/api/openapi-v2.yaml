        - DAILY_LIMIT_REACHED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - GENERATION_FAILED
        - PROVIDER_UNAVAILABLE
      description: |
        Stable machine codes. New codes may be added; clients treat an unknown code by its HTTP status.
